    <meta charset="UTF-8" />

    <meta name="description" content="Core Pharmacy Inventory, Batch Management, FEFO Expiry & Smart POS System" />
    <meta name="theme-color" content="#047857" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AushadhiX" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" href="/favicon.png" />

    <meta property="og:description" content="Core Pharmacy Inventory, Batch Management, FEFO Expiry & Smart POS System" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      // Strict zoom prevention for mobile PWA & browsers
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      });
      document.addEventListener('gesturechange', function (e) {
        e.preventDefault();
      });
      document.addEventListener('gestureend', function (e) {
        e.preventDefault();
      });
      // Prevent multi-touch pinch to zoom
      document.addEventListener(
        'touchmove',
        function (e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        },
        { passive: false }
      );
      // Prevent double-tap zooming on touch screens
      var lastTouchEnd = 0;
      document.addEventListener(
        'touchend',
        function (e) {
          var now = Date.now();
          if (now - lastTouchEnd <= 300) {
            // Only prevent if not tapping an interactive input/textarea
            var tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';
            if (tag !== 'input' && tag !== 'textarea' && tag !== 'select') {
              e.preventDefault();
            }
          }
          lastTouchEnd = now;
        },
        false
      );
      // Prevent Ctrl + Wheel zoom on desktops/trackpads
      window.addEventListener(
        'wheel',
        function (e) {
          if (e.ctrlKey) {
            e.preventDefault();
          }
        },
        { passive: false }
      );
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-emerald-100 selection:text-emerald-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
