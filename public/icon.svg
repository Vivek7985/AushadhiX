<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rectangle for Android icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner glowing ambient ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="6" opacity="0.3" />

  <!-- Central Pharmacy Cross + Pill Shield -->
  <g filter="url(#shadow)">
    <!-- Vertical bar -->
    <rect x="220" y="128" width="72" height="256" rx="20" fill="#ffffff" />
    <!-- Horizontal bar -->
    <rect x="128" y="220" width="256" height="72" rx="20" fill="#ffffff" />

    <!-- Center heart / Rx medical emblem -->
    <circle cx="256" cy="256" r="42" fill="url(#crossGrad)" />
    <!-- Pill detail inside -->
    <path d="M236 244 L276 268" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <circle cx="242" cy="248" r="4" fill="#ffffff" />
    <circle cx="270" cy="264" r="4" fill="#ffffff" />
  </g>

  <!-- Subtle brand text at bottom -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#a7f3d0" text-anchor="middle" letter-spacing="3">AUSHADHIX</text>
</svg>
